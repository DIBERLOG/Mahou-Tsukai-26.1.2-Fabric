plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
repositories { maven { url = 'https://maven.blamejared.com/' } }
dependencies {
    compileOnly project(':jousting')
    if(providers.gradleProperty('withJousting').isPresent())runtimeOnly project(':jousting')
    if(providers.gradleProperty('withApotheosis').isPresent()) {
        runtimeOnly files('../tools/compat/apotheosis-runtime/apotheosis-adventure-fabric-0.2.1-public.jar','../tools/compat/apotheosis-runtime/cardinal-components-api-8.0.1.jar','../tools/compat/apotheosis-runtime/placebo-fabric-0.1.3.jar')
    }
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Optional client integration: no JEI classes are loaded by the common entrypoint.
    // Use the distributed shaded JAR also in test source-set classpaths. The API
    // variant is unshaded and must not shadow JEI's runtime search implementation.
    compileOnly('mezz.jei:jei-26.1.2-fabric:29.47.0.111@jar') { transitive = false }
    if (providers.gradleProperty('withJei').isPresent()) {
        runtimeOnly('mezz.jei:jei-26.1.2-fabric:29.47.0.111@jar') { transitive = false }
    }
}
loom {
    accessWidenerPath = file('src/main/resources/mahoutsukai.accesswidener')
    runs {
        server { runDir 'run/server' }
        progressionPreview { server(); runDir 'run/progression-preview'; programArgs 'nogui' }
        client { runDir 'run/client' }
    }
    splitEnvironmentSourceSets()
    mods {
        mahoutsukai {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
sourceSets {
    selfCheck {
        java.srcDir '../scripts/shared'
        // Optional integration probes compile only when the actual local third-party API is available.
        if (!file('../tools/compat/apotheosis-runtime/apotheosis-adventure-fabric-0.2.1-public.jar').isFile()) {
            java.exclude '**/ApotheosisIntegrationChecks.java'
        }
        compileClasspath += files('../tools/compat/apotheosis-runtime/apotheosis-adventure-fabric-0.2.1-public.jar','../tools/compat/apotheosis-runtime/placebo-fabric-0.1.3.jar')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.main.runtimeClasspath + configurations.selfCheckRuntimeClasspath
    }
}
loom {
    mods {
        mahoutsukai_selfcheck { sourceSet sourceSets.selfCheck }
    }
    runs {
        battlePreview {
            server()
            source sourceSets.selfCheck
            runDir 'run/progression-preview'
            vmArgs '-Dmahoutsukai.battlePreview=true'
            programArgs 'nogui'
        }
        progressionChecks {
            server()
            source sourceSets.selfCheck
            runDir 'run/progression-checks'
            vmArgs '-Dmahoutsukai.progressionOnly=true'
            programArgs 'nogui'
        }
        auditFixChecks {
            server()
            source sourceSets.selfCheck
            runDir 'run/economy-checks'
            vmArgs '-Dmahoutsukai.audit032=true'
            programArgs 'nogui'
        }
        economyChecks {
            server()
            source sourceSets.selfCheck
            runDir 'run/economy-checks'
            programArgs 'nogui'
        }
    }
}
tasks.register('portSelfCheck', JavaExec) {
    dependsOn selfCheckClasses
    classpath = sourceSets.selfCheck.runtimeClasspath
    mainClass = 'stepsword.mahoutsukai.PortSelfCheck'
}
tasks.named('check') { dependsOn portSelfCheck }
tasks.register('gemComponentCheck', JavaExec) {
    dependsOn selfCheckClasses
    classpath = sourceSets.selfCheck.runtimeClasspath
    mainClass = 'stepsword.mahoutsukai.GemComponentCheck'
}
tasks.named('check') { dependsOn gemComponentCheck }
tasks.register('savedPlayerCheck', JavaExec) {
    dependsOn selfCheckClasses
    classpath = sourceSets.selfCheck.runtimeClasspath
    mainClass = 'stepsword.mahoutsukai.SavedPlayerCheck'
    doFirst {
        def saves = fileTree('run/server/mahou-port-test/players/data') { include '*.dat' }.files
        if (saves.size() != 1) throw new GradleException('Expected exactly one local test player save')
        args saves.first().absolutePath
        args providers.gradleProperty('expectedSavedMana').getOrElse('100')
    }
}

// Minecraft can catch a server exception and exit zero: require this run's success marker.
tasks.named('runEconomyChecks') {
    def marker = file('run/economy-checks/economy-checks.passed')
    doFirst { marker.delete() }
    doLast {
        if (!marker.isFile()) throw new GradleException('Economy server integration did not pass; inspect server log')
    }
}

// Test-only client captures frames through Minecraft's own screenshot feature.
sourceSets {
    visualCheck {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath + configurations.visualCheckRuntimeClasspath
    }
}
loom {
    mods { mahoutsukai_visualcheck { sourceSet sourceSets.visualCheck } }
    runs {
        magicVisual {
            client()
            source sourceSets.visualCheck
            runDir 'run/client'
            programArgs '--username', 'Player733', '--quickPlayMultiplayer', '127.0.0.1:25585', '--width', '1280', '--height', '720'
        }
    }
}

// The focused progression runner requires its fresh native-server completion receipt.
tasks.named('runProgressionChecks') {
    def marker = file('../analysis/phase026-progression-server.passed')
    doFirst { marker.delete() }
    doLast { if (!marker.isFile()) throw new GradleException('Progression server checks did not complete') }
}

// Negative probes have their own fresh receipt; the normal economy receipt remains mandatory.
tasks.named('runAuditFixChecks') {
    def marker=file('run/economy-checks/audit-033.passed')
    doFirst { marker.delete() }
    doLast { if(!marker.isFile()) throw new GradleException('Audit regression probes failed') }
}
